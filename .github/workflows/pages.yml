name: Web version (iPhone)

# نسخة الويب للآيفون + صفحة التحميل اللي الكود (QR) بيفتحها:
#   https://dr-magdy-ismail.github.io/       ← صفحة التحميل (أندرويد / آيفون)
#   https://dr-magdy-ismail.github.io/app/   ← التطبيق نفسه (ويب)
# أول مرة بس: Settings → Pages → Source: GitHub Actions
# (لو حبيت تنشر من main: Settings → Environments → github-pages → ضيف main)
on:
  push:
    # إذن النشر في GitHub (environment: github-pages) متسجّل على الفرع ده
    branches: [claude/new-session-qi53dv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        run: |
          mkdir -p _site/app
          cp pages/index.html _site/index.html
          cp web/index.html web/faq.js web/sw.js web/manifest.json web/logo.png web/icon-192.png web/icon-512.png web/apple-touch-icon.png _site/app/
          node --check _site/app/faq.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
