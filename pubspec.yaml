name: drmagdy
description: "د. مجدي إسماعيل — رحلة الحمل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # التطبيق نفسه مكتوب HTML (فولدر web) وبيتعرض جوه WebView
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  # كلام الخدمة (قراءة الروشتة + البوت) من الأندرويد نفسه
  http: ^1.2.0
  # تصوير الروشتة واختيار الملفات
  image_picker: ^1.1.0
  file_picker: ^13.3.2
  # مشاركة التقرير على واتساب + فتح الاتصال والواتساب والتقويم
  share_plus: ^13.3.1
  path_provider: ^2.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  # أندرويد 8+: نفس اللوجو على خلفية بيضا (الموبايل بيقصّها دايرة أو مربع حسب نوعه)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/app/
